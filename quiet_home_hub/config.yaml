name: Quiet Home Hub
version: "0.1.0"
slug: quiet_home_hub
description: Photos, home controls and family notes for the Quiet Home TV launcher.
url: https://github.com/pixelhop-glitch/quiet-home-addons
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:television-guide
panel_title: Quiet Home
ports:
  8098/tcp: 8098
ports_description:
  8098/tcp: TV dashboard API (home network only)
map:
  - media:rw
options:
  tv_key: ""
  theme: auto
  rotate_minutes: 15
  room_title: Living room
  light: ""
  light_label: Lights
  scenes: []
  climate: ""
  climate_label: Heating
  weather: ""
schema:
  tv_key: password
  theme: list(auto|bento|gallery)
  rotate_minutes: int(1,240)
  room_title: str
  light: str?
  light_label: str
  scenes:
    - str
  climate: str?
  climate_label: str
  weather: str?
